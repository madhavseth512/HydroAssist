# Which method each paper in `knowledge source/` is about.
#
# Every chunk in the knowledge base carried the tag "multiple" — 3,837 of 3,843 —
# so the consultant could not narrow a search to the papers that discuss the
# method being asked about. The tag is per document, not per chunk: a paper is
# about one method or a small family of them, and a 1,000-character chunk of a
# derivation often never names it.
#
# Ids: `implemented` must match src/calculator/registry.py exactly, so filtering
# by the method a user is running works. `other` is the rest of the corpus —
# methods and topics HydroAssist cannot compute but the consultant can discuss.
#
# `reviewed: false` marks an assignment made from the paper's title page that a
# hydrogeologist has not yet confirmed.

vocabulary:

  # Must equal the registry's method ids; tests/unit/test_corpus_methods.py checks it.
  implemented:
    - theis_1935
    - theis_recovery_1935
    - cooper_jacob_1946
    - papadopulos_cooper_1967
    - hantush_jacob_1955
    - boulton_1963
    - warren_root_1963

  # In the corpus, not in the calculator.
  other:
    - agarwal_1980              # equivalent time for buildup/recovery
    - akindunni_1992            # unsaturated-saturated response
    - aqtesolv_guide            # the AQTESOLV for Windows manual
    - barenblatt_1960           # double porosity, the original
    - barker_1988               # generalised radial flow, fractional dimension
    - birsoy_summers_1980       # step drawdown and intermittent pumping
    - butler_1988               # pumping tests in non-uniform aquifers
    - cooley_1973               # water-table aquitard
    - dagan_1967                # permeability and effective porosity
    - dougherty_babu_1984       # partial penetration, double porosity
    - gringarten_1971           # single horizontal fracture (dissertation)
    - gringarten_ramey_1974     # single horizontal fracture (paper)
    - halepaska_1972            # partial penetration, thick leaky
    - hantush_1955_steady       # steady three-dimensional flow
    - hantush_1955_strip        # Green's functions for an infinite strip
    - hantush_1960              # modified theory of leaky aquifers
    - hantush_1967              # relatively thick leaky aquifers
    - horizontal_well           # horizontal and slanted wells
    - moench_1984               # fissured reservoir with fracture skin
    - moench_1985               # large-diameter well, storative aquitard
    - moench_1995               # Neuman and Boulton combined
    - moench_1996               # improved Laplace transform solution
    - moench_1997               # finite diameter, anisotropic water table
    - murdoch_1994              # interceptor trench
    - neuman_1974               # delayed yield, unconfined
    - neuman_1975               # anisotropic unconfined
    - neuman_1979               # perspective on delayed yield
    - neuman_1987               # determining specific yield
    - neuman_witherspoon_1969   # leaky multiple-aquifer systems
    - novakowski_1989           # wellbore storage with finite-thickness skin
    - observation_well_response # response time of an observation well
    - sinusoidal_pumping        # periodic pumping tests
    - tartakovsky_neuman_2007   # three-dimensional saturated-unsaturated
    - wtaq_1999                 # the USGS WTAQ program
    - general_reference         # handbooks and procedure guides, many methods

