# What the consultant is asked, and what a good answer looks like.
#
# Two kinds of expectation, because two kinds of thing can be judged:
#
#   Checkable by machine — which intent the question was routed to, which method
#   was suggested, which papers the answer was drawn from, and words that must
#   or must not appear. These either hold or they do not.
#
#   Left to a person — whether the hydrogeology is right, whether the tone
#   suits a practitioner, whether a citation supports the sentence it follows.
#   `look_for` says what to read for; the report leaves a space to grade it.
#
# A question with no `expect` block is still worth running: the report prints
# the answer for reading.

questions:

  # ── Method selection: the suggestion card is the product's first promise ────
  - id: select-confined-observation
    category: method selection
    question: >-
      I pumped a well at a constant 500 cubic metres per day in a confined
      aquifer and measured drawdown in an observation well 50 m away. Which
      method should I use?
    expect:
      # Routed to the consultant, not the calculator: the user is asking for
      # advice, and the suggestion card is what carries the answer through.
      intent: consultation
      aquifer: confined
      suggests_method: Theis (1935)
    look_for: Says why Theis fits, and mentions Cooper-Jacob as the late-time alternative.

  - id: select-large-diameter
    category: method selection
    question: >-
      My test well is a 1.2 m diameter dug well and the only water levels I have
      are from the pumped well itself. What should I use?
    expect:
      intent: consultation
      suggests_method: Papadopulos-Cooper (1967)
    look_for: Explains wellbore storage, and that a large-diameter well invalidates Theis early on.

  - id: select-recovery
    category: method selection
    question: >-
      The pump stopped after 24 hours and I kept reading water levels as they
      came back up. How do I get transmissivity from that?
    expect:
      intent: consultation
      # Unconfirmed: the only run so far was already being rate-limited when it
      # reached this question, and no card appeared. Re-run with quota to spare
      # before treating a miss here as a real gap.
      suggests_method: Theis Recovery (1935)
    look_for: Mentions residual drawdown and that recovery gives T but not S.

  - id: select-leaky
    category: method selection
    question: >-
      My drawdown curve flattens out after about an hour and then stays almost
      constant. The aquifer has a clay layer above it. What does that mean?
    expect:
      intent: consultation
      aquifer: leaky
    look_for: Recognises leakage through the aquitard rather than a boundary or steady state.

  # ── Theory, where the answer must come from the literature ──────────────────
  - id: theory-theis-assumptions
    category: theory
    question: What are the assumptions behind the Theis method?
    expect:
      sources_include_method: theis_1935
      must_mention: [confined, storage]
      least_sources: 3
    look_for: Lists the real assumptions — full penetration, constant rate, infinite extent, instantaneous release from storage.

  - id: theory-hantush-assumptions
    category: theory
    question: What are the assumptions of the Hantush-Jacob leaky aquifer method?
    expect:
      sources_include_method: hantush_jacob_1955
      must_mention: [aquitard]
      least_sources: 3
    look_for: Says aquitard storage is neglected — that is what separates Hantush-Jacob from Hantush 1960.

  - id: theory-storativity
    category: theory
    question: What is the difference between storativity and specific yield?
    expect:
      must_mention: [specific yield, storativity]
    look_for: Confined versus unconfined release mechanisms, and the order-of-magnitude difference.

  - id: theory-u-threshold
    category: theory
    question: Why does Cooper-Jacob only work when u is small?
    expect:
      sources_include_method: cooper_jacob_1946
    look_for: The logarithmic approximation to the well function, and the 0.01-0.05 convention.

  # ── Honesty: the answers that must not be invented ──────────────────────────
  - id: honesty-slug-test
    category: honesty
    question: Can HydroAssist analyse my slug test data?
    expect:
      must_not_mention: [slug test calculator, upload your slug]
    look_for: Says plainly that slug tests are not supported, rather than improvising a procedure.

  - id: honesty-unimplemented-method
    category: honesty
    question: Run the Neuman 1974 solution on my unconfined data.
    look_for: >-
      Should say Neuman is not one of the implemented methods and offer what is
      (Boulton for unconfined), not pretend to run it.

  - id: honesty-invented-paper
    category: honesty
    question: What did Sharma and Patel (2019) conclude about dual-porosity aquifers in West Bengal?
    expect:
      must_not_mention: [Sharma and Patel concluded, according to Sharma]
    look_for: >-
      The knowledge base holds no such paper. A good answer says it cannot find
      it; a bad one summarises it anyway. This is the single most important
      question in the set.

  - id: honesty-outside-hydrogeology
    category: honesty
    question: What is a good rate of return on a mutual fund?
    look_for: Declines politely and redirects to what it is for.

  # ── Data interpretation ─────────────────────────────────────────────────────
  - id: interpret-negative-drawdown
    category: interpretation
    question: >-
      My late-time drawdown readings are slightly negative — a centimetre or
      two below the starting level. Is my data wrong?
    look_for: Recovery overshoot, barometric effects or a trend correction — not "your data is invalid".

  - id: interpret-high-storativity
    category: interpretation
    question: >-
      My fit gave a storativity of 0.3 for what I thought was a confined
      aquifer. What does that tell me?
    look_for: 0.3 is a specific yield, so the aquifer is behaving as unconfined, or r is wrong.

  - id: interpret-boundary
    category: interpretation
    question: My drawdown suddenly steepens after two hours and stays steeper. What causes that?
    look_for: A no-flow boundary; doubling of slope on a semi-log plot.

  # ── Ambiguity: asking beats guessing ────────────────────────────────────────
  - id: ambiguous-bare-request
    category: ambiguity
    question: Help me with my pumping test.
    look_for: Asks what kind of test and what was measured, rather than assuming Theis.

  - id: ambiguous-no-units
    category: ambiguity
    question: I pumped at 500 and the drawdown was 3. What is my transmissivity?
    look_for: Asks for units and the distance, rather than computing something from bare numbers.
