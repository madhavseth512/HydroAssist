# HydroAssist on a single VM: the app, and Caddy in front of it for HTTPS.
#
# Configuration comes from .env next to this file (copy .env.example).
#   docker compose up -d --build
#
# See DEPLOY.md for the whole setup, including the firewall steps Oracle needs.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HYDROASSIST_ENV: default
      # The site is served over HTTPS by Caddy, so the session cookie is Secure.
      HYDROASSIST_COOKIE_SECURE: "1"
    # Reachable only from Caddy, never directly from the internet.
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"       # Let's Encrypt's HTTP challenge, and the redirect to HTTPS
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates persist here; without it every restart re-issues them and
      # runs into Let's Encrypt's rate limits.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
